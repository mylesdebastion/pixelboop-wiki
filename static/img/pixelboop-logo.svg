<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="24" viewBox="0 0 180 24" xmlns="http://www.w3.org/2000/svg">
  <!-- PixelBoop logo in 3x5 pixel font -->
  <!-- Each letter is 3 pixels wide, 5 pixels tall, with 1 pixel spacing -->
  <!-- Pixel size: 4x4 with 1px gap -->
  
  <defs>
    <linearGradient id="pixelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7dc6f"/>
      <stop offset="25%" style="stop-color:#4ecdc4"/>
      <stop offset="50%" style="stop-color:#45b7d1"/>
      <stop offset="75%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#9acd32"/>
    </linearGradient>
  </defs>
  
  <style>
    .pixel { fill: url(#pixelGradient); }
    @media (prefers-color-scheme: dark) {
      .pixel { fill: url(#pixelGradient); }
    }
  </style>
  
  <!-- P: x=0 -->
  <rect class="pixel" x="0" y="0" width="3" height="3" rx="0.5"/>
  <rect class="pixel" x="4" y="0" width="3" height="3" rx="0.5"/>
  <rect class="pixel" x="0" y="4" width="3" height="3" rx="0.5"/>
